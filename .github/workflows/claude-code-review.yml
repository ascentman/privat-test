name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Write, so the review can actually post its findings as PR comments.
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history: the review diffs the PR against its base branch, and
          # a shallow clone has no base commit to diff against.
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # A direct prompt rather than the code-review plugin: that skill farms
          # the work out to async subagents and then waits for them, but this
          # session ends before they report, so every run posted nothing.
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} of
            ${{ github.repository }} and post your findings as a PR comment.

            Do the work yourself in this session. Do not delegate to subagents,
            do not launch background tasks, and do not wait on anything — the
            session ends as soon as you stop, so delegated work never reports.

            Steps:
            1. Read the diff: `gh pr diff ${{ github.event.pull_request.number }}`
            2. Read any file you need more context on.
            3. Post exactly one comment with:
               `gh pr comment ${{ github.event.pull_request.number }} --body "..."`

            Look for correctness bugs, missed edge cases, error handling gaps,
            and simplifications. Anchor each finding to a file and line, and say
            what would actually go wrong. Skip style nits the linter catches.
            If you find nothing substantive, say so in one line — always post a
            comment, so a green run is distinguishable from a broken one.
          # Surfaces individual tool calls, so a run that reviews nothing can be
          # diagnosed from the log instead of guessed at.
          show_full_output: true
          # Without this the agent's first tool call is denied outright
          # ("Error: Execute skill: ..."). --allowedTools would risk replacing
          # the action's own tool list, including its comment-posting tools.
          claude_args: '--permission-mode bypassPermissions'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

