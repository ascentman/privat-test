targets:
  $default:
    builders:
      freezed:
        options:
          # Union states are discriminated by a `type` key rather than
          # `runtimeType`, so cached/serialised payloads stay readable.
          union_key: type
          union_value_case: snake
      json_serializable:
        options:
          # TMDB uses snake_case; models declare `@JsonKey` only where the
          # Dart name differs beyond the automatic conversion.
          field_rename: snake
          explicit_to_json: true
          create_to_json: true
          include_if_null: false
